<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  background-color: #06030B;
  color: #FFFFFF;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  position: relative;
}

/* Common Shared Components */
.brand-logo { height: 42px; display: block; }
.header-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: #32EEE2;
  letter-spacing: 0.12em;
  padding: 6px 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 100px;
  background: rgba(255, 255, 255, 0.02);
}
.eyebrow-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: #32EEE2;
  letter-spacing: 0.12em;
  margin-bottom: 14px;
}

/* 1. EDITORIAL / MANIFESTO */
.layout-manifesto {
  width: 1080px;
  height: 1080px;
  padding: 64px 72px 52px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.manifesto-header { display: flex; align-items: center; justify-content: space-between; }
.manifesto-body { display: flex; flex-direction: column; margin: auto 0; }
.manifesto-bracket {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  color: #9F7BEE;
  letter-spacing: 0.1em;
  margin-bottom: 18px;
}
.manifesto-headline {
  font-size: 64px;
  font-weight: 800;
  line-height: 1.08;
  letter-spacing: -0.035em;
  color: #FFFFFF;
  margin-bottom: 24px;
  max-width: 940px;
}
.manifesto-lead {
  font-size: 20px;
  line-height: 1.5;
  color: #D4D4D8;
  margin-bottom: 48px;
  max-width: 820px;
}
.manifesto-columns {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 32px;
}
.m-col { display: flex; flex-direction: column; gap: 6px; }
.m-idx { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #32EEE2; font-weight: 700; }
.m-title { font-size: 15px; font-weight: 800; color: #FFFFFF; letter-spacing: 0.04em; }
.m-desc { font-size: 13px; color: #A1A1AA; line-height: 1.45; }
.manifesto-footer {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.f-lbl { color: #9F7BEE; font-weight: 700; margin-right: 6px; }
.f-val { color: #71717A; }

/* 2. TECHNICAL ARCHITECTURE */
.layout-architecture {
  width: 1080px;
  height: 1080px;
  padding: 56px 64px 44px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.arch-top { display: flex; align-items: center; justify-content: space-between; }
.arch-intro { margin-top: 10px; }
.arch-headline { font-size: 44px; font-weight: 800; line-height: 1.15; margin-bottom: 6px; }
.arch-sub { font-size: 17px; color: #D4D4D8; }
.arch-topology-canvas {
  position: relative;
  height: 480px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
}
.topo-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.stage-col { position: relative; z-index: 3; }
.col-caller {
  width: 210px;
  background: #0B0614;
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 18px;
}
.node-badge { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; color: #32EEE2; margin-bottom: 6px; }
.node-badge.rose { color: #FF54A6; }
.node-name { font-size: 15px; font-weight: 800; color: #FFFFFF; }
.node-meta { font-size: 12px; color: #A1A1AA; margin-top: 4px; }
.node-port { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #71717A; margin-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 8px; }
.col-vault { width: 280px; display: flex; flex-direction: column; align-items: center; }
.vault-boundary-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #32EEE2; letter-spacing: 0.1em; margin-bottom: 8px; }
.vault-chassis {
  width: 100%;
  background: #0E071A;
  border: 1.5px solid rgba(255, 255, 255, 0.25);
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
}
.vault-indicator { width: 8px; height: 8px; border-radius: 50%; background: #10B981; margin: 0 auto 10px; box-shadow: 0 0 8px #10B981; }
.vault-title { font-size: 16px; font-weight: 800; letter-spacing: 0.06em; }
.vault-subtitle { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #32EEE2; margin-top: 4px; }
.vault-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 12px; }
.vm-cell { display: flex; flex-direction: column; }
.vm-l { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: #71717A; }
.vm-v { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #FFFFFF; }
.vault-ports { display: flex; justify-content: space-between; margin-top: 14px; border-top: 1px dashed rgba(255, 255, 255, 0.08); padding-top: 8px; }
.port-tag { font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 700; color: #FF54A6; }
.port-tag.cyan { color: #32EEE2; }
.col-targets { display: flex; flex-direction: column; gap: 24px; }
.target-unit {
  width: 250px;
  background: #0B0614;
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 16px 18px;
}
.arch-footer {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #71717A;
}

/* 3. DATA VISUALIZATION */
.layout-data-viz {
  width: 1080px;
  height: 1080px;
  padding: 56px 64px 44px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.data-header { display: flex; align-items: center; justify-content: space-between; }
.data-title-block { margin-top: 10px; }
.data-headline { font-size: 46px; font-weight: 800; line-height: 1.15; margin-bottom: 8px; }
.data-sub { font-size: 18px; color: #D4D4D8; }
.data-hero-metric { display: flex; align-items: baseline; gap: 28px; margin: 24px 0; }
.metric-huge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 140px;
  font-weight: 800;
  line-height: 0.85;
  letter-spacing: -0.05em;
  color: #FFFFFF;
}
.metric-descriptor { display: flex; flex-direction: column; gap: 4px; }
.m-desc-title { font-size: 20px; font-weight: 700; letter-spacing: 0.06em; color: #FFFFFF; }
.m-desc-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #32EEE2; letter-spacing: 0.08em; }
.continuum-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.continuum-labels { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
.c-lbl-bad { color: #EF4444; }
.c-lbl-floor { color: #FF54A6; }
.c-lbl-good { color: #10B981; }
.continuum-track {
  position: relative;
  height: 24px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 100px;
  display: flex;
  overflow: visible;
}
.track-bad { width: 50%; background: #7F1D1D; border-radius: 100px 0 0 100px; }
.track-buffer { width: 10%; background: #FF007A; }
.track-good { width: 40%; background: rgba(16, 185, 129, 0.4); border-radius: 0 100px 100px 0; }
.track-needle-wrap {
  position: absolute;
  left: 55%;
  top: -34px;
  bottom: -12px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 4;
}
.needle-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 800;
  background: #FF007A;
  color: #FFFFFF;
  padding: 4px 10px;
  border-radius: 6px;
  white-space: nowrap;
}
.needle-line { width: 3px; height: 100%; background: #FF007A; }
.continuum-scale { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #71717A; }
.scale-focal { color: #FF54A6; font-weight: 800; }
.data-status-strip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 20px;
}
.status-left { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #D4D4D8; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10B981; }
.status-code { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #32EEE2; }
.data-footer {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #71717A;
}

/* 4. PRODUCT SYSTEM DIAGRAM */
.layout-system-diagram {
  width: 1080px;
  height: 1080px;
  padding: 56px 64px 44px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.sys-header { display: flex; align-items: center; justify-content: space-between; }
.sys-intro { margin-top: 10px; }
.sys-headline { font-size: 44px; font-weight: 800; line-height: 1.15; margin-bottom: 8px; }
.sys-sub { font-size: 18px; color: #D4D4D8; }
.pipeline-arena {
  position: relative;
  height: 480px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
}
.pipeline-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.origin-pod {
  position: relative;
  z-index: 3;
  width: 270px;
  background: #0C0617;
  border: 1.5px solid rgba(255, 255, 255, 0.25);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
}
.pod-kicker { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; color: #32EEE2; letter-spacing: 0.1em; margin-bottom: 6px; }
.pod-title { font-size: 20px; font-weight: 800; color: #FFFFFF; }
.pod-sub { font-size: 13px; color: #A1A1AA; margin-top: 2px; }
.pod-details { display: flex; flex-direction: column; gap: 6px; margin: 18px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; }
.pod-details .cyan { color: #32EEE2; }
.pod-foot { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: #9F7BEE; letter-spacing: 0.08em; }
.target-rails {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 320px;
}
.rail-row {
  background: #0B0614;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-left: 3px solid #703AE6;
  border-radius: 10px;
  padding: 16px 20px;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
}
.rail-row.rail-soroswap { border-left-color: #32EEE2; }
.rail-row.rail-aquarius { border-left-color: #FF54A6; }
.rail-tag-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
.r-pill { font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.r-pill.violet { background: rgba(112, 58, 230, 0.2); color: #9F7BEE; }
.r-pill.cyan { background: rgba(50, 238, 226, 0.15); color: #32EEE2; }
.r-pill.rose { background: rgba(255, 0, 122, 0.15); color: #FF54A6; }
.r-param { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: #71717A; }
.rail-brand { font-size: 16px; font-weight: 800; color: #FFFFFF; }
.rail-summary { font-size: 12px; color: #A1A1AA; margin-top: 4px; line-height: 1.4; }
.sys-footer {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #71717A;
}

/* 5. ASYMMETRIC HERO COMPOSITION */
.layout-asymmetric-hero {
  width: 1080px;
  height: 1080px;
  padding: 56px 64px 44px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hero-top { display: flex; align-items: center; justify-content: space-between; }
.asym-container {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  align-items: center;
  gap: 48px;
  height: 800px;
}
.asym-headline { font-size: 54px; font-weight: 800; line-height: 1.1; margin-bottom: 16px; }
.asym-lead { font-size: 18px; color: #D4D4D8; margin-bottom: 36px; line-height: 1.5; }
.asym-specs { display: flex; flex-direction: column; gap: 20px; }
.spec-tile { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: baseline; }
.st-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #32EEE2; }
.st-title { font-size: 14px; font-weight: 700; color: #FFFFFF; letter-spacing: 0.04em; display: block; margin-bottom: 4px; }
.st-desc { font-size: 13px; color: #A1A1AA; line-height: 1.45; }
.wireframe-chassis {
  background: #0B0614;
  border: 1.5px solid rgba(255, 255, 255, 0.15);
  border-radius: 16px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.wf-header, .wf-footer {
  display: flex;
  justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: #71717A;
}
.wf-canvas { position: relative; width: 320px; height: 320px; margin: 0 auto; }
.iso-svg { width: 100%; height: 100%; }
.wf-badge-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  background: rgba(11, 6, 20, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  padding: 8px 14px;
}
.wfb-kicker { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: #32EEE2; font-weight: 700; }
.wfb-val { font-size: 18px; font-weight: 800; color: #FFFFFF; display: block; margin: 2px 0; }
.wfb-status { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: #71717A; }
.asym-footer {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 18px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #71717A;
}

/* 6. CINEMATIC MINIMAL */
.layout-cinematic-minimal {
  width: 1080px;
  height: 1080px;
  padding: 64px 72px 52px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.cin-top { display: flex; align-items: center; justify-content: space-between; }
.cin-logo { height: 48px; display: block; }
.cin-tag { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #32EEE2; letter-spacing: 0.12em; }
.cin-center { display: flex; flex-direction: column; justify-content: center; margin: auto 0; }
.cin-headline { font-size: 88px; font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; color: #FFFFFF; max-width: 920px; }
.cin-sub { font-size: 26px; font-weight: 500; color: #D4D4D8; margin-top: 36px; letter-spacing: -0.01em; max-width: 820px; line-height: 1.4; }
.cin-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: #71717A;
  letter-spacing: 0.06em;
}
.cin-status { display: flex; align-items: center; gap: 10px; }
.cin-pulse { width: 7px; height: 7px; border-radius: 50%; background: #10B981; box-shadow: 0 0 8px #10B981; }
.cin-url { color: #A1A1AA; font-weight: 600; }
</style>
</head>
