# Checks every push and pull request. Nothing here deploys, and no test can
# reach a paid API: pipeline/tests/offline.py turns the network off first.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (pinned, hashed)
        run: pip install --require-hashes -r requirements.lock
      - name: Lint (syntax errors, undefined names)
        run: pipx run ruff==0.9.10 check pipeline core
      - name: Claims registry matches the facts ledger
        run: python -m pipeline.scripts.build_claims_registry --check
      - name: Tests, network off
        run: python -m pipeline.tests.offline

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hermes-mission
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hermes-mission/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
