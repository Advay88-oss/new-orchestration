<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root {
  --ink-hero: #FFFFFF;
  --ink-body: rgba(255,255,255,0.78);
  --ink-muted: rgba(255,255,255,0.64);
  --ink-dim: rgba(255,255,255,0.50);
  --c-obsidian: #07020D;
  --c-violet_bloom: #471485;
  --c-fuchsia_bloom: #5E0D46;
  --c-lavender: #A387FF;
  --c-coral: #FC5457;
  --c-cyan: #22D3C4;
  --c-white: #FFFFFF;
  --space-xs: 8px;
  --space-sm: 16px;
  --space-md: 32px;
  --space-lg: 56px;
  --space-xl: 96px;
  --hairline: rgba(255,255,255,0.08);
  --font-sans: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Mono', ui-monospace, monospace;
  --margin: 120px;
  --safe-width: 840px;
  --track-upper: 0.14em;
  --type-hero-size: 180px;
  --type-hero-weight: 700;
  --type-hero-tracking: -0.04em;
  --type-hero-leading: 0.92;
  --type-headline-size: 52px;
  --type-headline-weight: 600;
  --type-headline-tracking: -0.02em;
  --type-headline-leading: 1.12;
  --type-subhead-size: 34px;
  --type-subhead-weight: 500;
  --type-subhead-tracking: -0.01em;
  --type-subhead-leading: 1.25;
  --type-body-size: 28px;
  --type-body-weight: 400;
  --type-body-tracking: 0;
  --type-body-leading: 1.45;
  --type-label-size: 18px;
  --type-label-weight: 600;
  --type-label-tracking: 0.14em;
  --type-label-leading: 1.2;
  --type-caption-size: 16px;
  --type-caption-weight: 400;
  --type-caption-tracking: 0.02em;
  --type-caption-leading: 1.4;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1080px; }
body {
  background:#07020D;
  color:#FFFFFF;
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
  position:relative; overflow:hidden;
}
.bg { position:absolute; inset:0; }
.bg--texture { background-size:cover; background-position:center; opacity:0.55; }
.bg--scrim { background:linear-gradient(180deg,#07020DCC 0%,#07020DF2 100%); }

/* Reserved logo band. Content can never enter it, so collision is impossible. */
.logo-band {
  position:absolute; top:var(--margin); left:var(--margin);
  height:32px; display:flex; align-items:center; gap:10px; z-index:2;
}
.logo-mark { width:32px; height:32px; border-radius:8px;
  background:#A387FF; display:block; }
.logo-word { font-size:15px; font-weight:700; letter-spacing:0.18em;
  color:var(--ink-muted); text-transform:uppercase; }

.frame {
  position:absolute; left:var(--margin); right:var(--margin);
  top:calc(var(--margin) + 64px);
  width:var(--safe-width); max-height:400px;
  display:flex; flex-direction:column; gap:var(--space-md); z-index:2;
}
.headline {
  font-size:var(--type-headline-size); font-weight:var(--type-headline-weight);
  letter-spacing:var(--type-headline-tracking); line-height:var(--type-headline-leading);
  color:var(--ink-hero); text-wrap:balance;
}
.subhead {
  font-size:var(--type-subhead-size); font-weight:var(--type-subhead-weight);
  letter-spacing:var(--type-subhead-tracking); line-height:var(--type-subhead-leading);
  color:var(--ink-body); max-width:calc(var(--safe-width) * 0.88);
}
.stack { display:flex; flex-direction:column; gap:var(--space-sm); }
.seq { display:flex; flex-direction:column; gap:var(--space-sm);
  border-left:2px solid #A387FF; padding-left:var(--space-md); }
.cmp { display:grid; grid-template-columns:1fr 1px 1fr; gap:var(--space-md); align-items:start; }
.cmp-rule { background:var(--hairline); height:100%; min-height:96px; }
.cmp-col { display:flex; flex-direction:column; gap:var(--space-sm); }

.block { font-size:var(--type-body-size); line-height:var(--type-body-leading); color:var(--ink-body); }
.block--muted { color:var(--ink-dim); }
.block--primary { color:var(--ink-hero); }
.block--focal .stat-value { color:#A387FF; }
.stat-value {
  font-family:var(--font-mono); font-size:var(--type-hero-size);
  font-weight:var(--type-hero-weight); letter-spacing:var(--type-hero-tracking);
  line-height:var(--type-hero-leading); color:var(--ink-hero); display:block;
}
.label-text {
  font-size:var(--type-label-size); font-weight:var(--type-label-weight);
  letter-spacing:var(--track-upper);   /* the fix for TECHNICALARCHITECTURE */
  text-transform:uppercase; color:var(--ink-muted);
}
.block--step { display:flex; gap:var(--space-sm); align-items:baseline; }
.step-index { font-family:var(--font-mono); font-size:var(--type-caption-size);
  color:#A387FF; letter-spacing:0.08em; }
.disclaimer {
  position:absolute; left:var(--margin); bottom:var(--margin);
  font-size:var(--type-caption-size); letter-spacing:var(--type-caption-tracking);
  color:var(--ink-dim); max-width:var(--safe-width); z-index:2;
}
</style></head>
<body>

<div class="logo-band"><span class="logo-mark"></span><span class="logo-word">VANNA</span></div>
<div class="frame">
  <h1 class="headline">Lending Collateral Idles in Isolated Silos</h1>
  <p class="subhead">Collateral remains concentrated in single-protocol lockups rather than backing circulating secondary liquidity.</p>
  <div class="stack"><div class="block block--stat block--primary block--focal"><span class="stat-value">128:1</span></div><div class="block block--label block--secondary"><span class="label-text">Disparity ratio of lending TVL to active AMM liquidity</span></div><div class="block block--caption block--muted">Blend holds $159,033,033 in TVL while Soroswap holds $1,239,028 in TVL.</div></div>
</div>

</body></html>
